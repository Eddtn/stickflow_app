name: stockflow
description: Inventory & Operations Manager for SMEs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.16.0
  # cloud_firestore: ^4.14.0
  # firebase_storage: ^11.6.0
  # firebase_messaging: ^14.7.9

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.1

  # UI & Charts
  fl_chart: ^0.66.2
  mobile_scanner: ^4.0.0       # Barcode scanner
  image_picker: ^1.0.7

  # Export
  pdf: ^3.10.8
  printing: ^5.12.0
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2

  # Notifications
  # flutter_local_notifications: ^16.3.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  cached_network_image: ^3.3.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  barcode_widget: ^2.0.4
  local_auth: ^3.0.2
  file_picker: ^11.0.3
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/icons/StockFlowIcon.png

                                                                            




flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/StockFlowIcon.png"
  min_sdk_android: 21
























